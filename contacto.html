<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title> | Tekin Esports</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="logo-transition">
  <img src="img/logo-tekin.png" alt="Tekin Esports">
</div>


<header class="navbar">


  <div class="brand">
    <img src="img/logo-tekin.png">
    <img src="img/letra-tekin.png" class="text-logo">
  </div>
  <nav class="menu">
    <a href="index.html">Inicio</a>
    <a href="quienessomos.html">QUIÉNES SOMOS</a>
    <a href="roster.html">Roster</a>
    <a href="contacto.html">Contacto</a>
  </nav>
</header>

<section class="contact-section">

  <a href="https://x.com/Tekin__Esports" target="_blank" class="contact-card link-card x">
    <h3>𝕏 / Twitter</h3>
    <p>@Tekin__Esports</p>
  </a>

  <a href="https://www.instagram.com/tekin__esports/" target="_blank" class="contact-card link-card ig">
    <h3>Instagram</h3>
    <p>@tekin__esports</p>
  </a>

  <a class="contact-card link-card mail">
    <h3>Email</h3>
    <p>tekin.esports.contacto@gmail.com</p>
  </a>

</section>



<footer class="footer">
  © Tekin Esports | #GoTekin
</footer>

<script>
  const transition = document.getElementById("logo-transition");
  const links = document.querySelectorAll("a");

  links.forEach(link => {
    link.addEventListener("click", e => {
      const href = link.getAttribute("href");

      if (href && !href.startsWith("#")) {
        e.preventDefault();
        transition.classList.add("active");

        setTimeout(() => {
          window.location.href = href;
        }, 600);
      }
    });
  });
</script>


</body>
</html>
