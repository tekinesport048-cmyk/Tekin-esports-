<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Roster | Tekin Esports</title>
  <link rel="stylesheet" href="style.css">
</head>


<body>

<div id="logo-transition">
  <img src="img/logo-tekin.png" alt="Tekin Esports">
</div>



<header class="navbar">
  <div class="brand">
    <img src="img/logo-tekin.png">
    <img src="img/letra-tekin.png" class="text-logo">
  </div>
  <nav class="menu">
    <a href="index.html">Inicio</a>
    <a href="quienessomos.html">Quienes somos</a>
    <a href="roster.html">Equipos</a>
    <a href="contacto.html">contacto</a>
    
   
  </nav>
</header>

<h1 class="page-title">Equipos Oficial</h1>

<div class="cards">
<a href="valorant.html" class="valorant-btn">VALORANT</a>
</div>

<footer class="footer">© Tekin Esports</footer>





<script>
  const transition = document.getElementById("logo-transition");
  const links = document.querySelectorAll("a");

  links.forEach(link => {
    link.addEventListener("click", e => {
      const href = link.getAttribute("href");

      if (href && !href.startsWith("#")) {
        e.preventDefault();
        transition.classList.add("active");

        setTimeout(() => {
          window.location.href = href;
        }, 600);
      }
    });
  });
</script>




</body>
</html>
